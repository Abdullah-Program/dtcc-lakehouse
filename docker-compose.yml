services:
  spark:
    image: apache/spark:4.1.3-scala2.13-java17-python3-r-ubuntu
    container_name: dtcc_spark
    user: "root"
    working_dir: /workspace
    environment:
      - SPARK_LOCAL_IP=127.0.0.1
      - SPARK_HOME=/opt/spark
      - PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.9-src.zip:/workspace
    volumes:
      - .:/workspace
      - ./.ivy2:/root/.ivy2.5.2
    deploy:
      resources:
        limits:
          memory: 2500M
    command: ["sleep", "infinity"]

  redpanda:
    image: redpandadata/redpanda:v24.2.14
    container_name: dtcc_redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    deploy:
      resources:
        limits:
          memory: 750M
