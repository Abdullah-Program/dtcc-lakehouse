name: dtcc-lakehouse

services:
  spark:
    image: apache/spark:4.1.3-scala2.13-java17-python3-r-ubuntu
    container_name: dtcc_spark
    user: "root"
    working_dir: /workspace
    environment:
      - SPARK_LOCAL_IP=127.0.0.1
      - SPARK_HOME=/opt/spark
      - PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.9-src.zip:/workspace
      - AWS_REGION=garage
      - AWS_ENDPOINT_URL=http://garage:3900
      - AWS_ACCESS_KEY_ID=GK135da1acc67448e5f988c2d9
      - AWS_SECRET_ACCESS_KEY=8ebd487cc54261411c33d336465f8a26ba58c064bddb3c56692189b2b4a21eba
      - AWS_REQUEST_CHECKSUM_CALCULATION=when_required
      - AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
    volumes:
      - .:/workspace
      - ./.ivy2:/root/.ivy2.5.2
    deploy:
      resources:
        limits:
          memory: 2500M
    command: ["sleep", "infinity"]

  redpanda:
    image: redpandadata/redpanda:v24.2.14
    container_name: dtcc_redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    deploy:
      resources:
        limits:
          memory: 750M

  garage:
    image: dxflrs/garage:v2.4.1
    container_name: dtcc_garage
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    ports:
      - "3900:3900"
      - "3902:3902"
      - "3903:3903"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    deploy:
      resources:
        limits:
          memory: 250M

  polaris:
    image: apache/polaris:latest
    container_name: dtcc_polaris
    ports:
      - "8181:8181"
    environment:
      - POLARIS_BOOTSTRAP_CREDENTIALS=POLARIS,root,s3cr3t
      - AWS_REGION=garage
      - AWS_ACCESS_KEY_ID=GK135da1acc67448e5f988c2d9
      - AWS_SECRET_ACCESS_KEY=8ebd487cc54261411c33d336465f8a26ba58c064bddb3c56692189b2b4a21eba
      - AWS_REQUEST_CHECKSUM_CALCULATION=when_required
      - AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
    deploy:
      resources:
        limits:
          memory: 512M

  trino:
    image: trinodb/trino:latest
    container_name: dtcc_trino
    ports:
      - "8080:8080"
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog
      - ./infra/trino/jvm.config:/etc/trino/jvm.config
    deploy:
      resources:
        limits:
          memory: 1500M
    depends_on:
      - polaris
      - garage

volumes:
  garage_meta:
  garage_data:
